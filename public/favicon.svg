<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Rounded square background -->
  <rect width="100" height="100" rx="22" fill="#D97757"/>

  <!-- Stylised "A" built from three nodes + connecting lines — suggests architecture/graph -->
  <!-- Left node -->
  <circle cx="28" cy="68" r="7" fill="white" opacity="0.95"/>
  <!-- Right node -->
  <circle cx="72" cy="68" r="7" fill="white" opacity="0.95"/>
  <!-- Top node -->
  <circle cx="50" cy="26" r="7" fill="white" opacity="0.95"/>
  <!-- Centre cross-bar node -->
  <circle cx="50" cy="54" r="5" fill="white" opacity="0.85"/>

  <!-- Left leg -->
  <line x1="32" y1="63" x2="46" y2="31" stroke="white" stroke-width="5.5" stroke-linecap="round" opacity="0.9"/>
  <!-- Right leg -->
  <line x1="68" y1="63" x2="54" y2="31" stroke="white" stroke-width="5.5" stroke-linecap="round" opacity="0.9"/>
  <!-- Cross-bar -->
  <line x1="35" y1="54" x2="65" y2="54" stroke="white" stroke-width="4.5" stroke-linecap="round" opacity="0.9"/>
</svg>
